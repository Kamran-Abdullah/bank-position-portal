<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unpresented Cheques · Bank Position Portal</title>
<link rel="stylesheet" href="/app.css">
<style>
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
table.chq{width:100%;border-collapse:collapse;table-layout:fixed}
table.chq th,table.chq td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.chq th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#fafbfd}
table.chq td.num,table.chq th.num{text-align:right;font-variant-numeric:tabular-nums}
table.chq col.c-sr{width:5%} table.chq col.c-no{width:13%} table.chq col.c-party{width:31%} table.chq col.c-amt{width:14%} table.chq col.c-date{width:12%} table.chq col.c-act{width:25%}
table.chq td.party{overflow-wrap:anywhere}
table.chq tr.total td{background:#f7f9fb;font-weight:700}
table.chq tr.flagged td{background:#fff8e6}
.sec{margin-bottom:18px}
.sec h3{margin:0;padding:12px 14px;background:#eef3f8;color:var(--brand-ink);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.sec h3 .t{font-variant-numeric:tabular-nums}
.flagnote{display:block;color:#8a5d10;font-size:12.5px;margin-top:3px}
.note{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}
.grandbar{background:#12507b;color:#fff;border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;font-weight:750;font-size:16px;font-variant-numeric:tabular-nums}
.acts button{margin:0 4px 4px 0}
.okbox{background:var(--green);color:var(--green-ink);padding:10px 14px;border-radius:8px}
</style>
</head>
<body>
<main><div class="wrap">
  <div class="pagehead">
    <div><h1>Unpresented Cheques</h1><div class="sub" id="sub">Loading…</div></div>
    <div class="toolbar" style="margin:0;flex-wrap:wrap">
      <span class="tabs" id="tabs"></span>
      <button class="sm primary" id="add" hidden>+ Add cheque</button>
      <button class="sm" id="imp" hidden>Import Excel list</button>
      <button class="sm" id="rem" hidden title="Look for these cheques in the statements already uploaded">Check statements now</button>
      <button class="sm" id="pdf">Export PDF</button>
      <button class="sm" id="exp">Export Excel</button>
    </div>
  </div>
  <input type="file" id="file" accept=".xlsx,.xlsm" hidden>
  <div id="msg"></div>
  <div id="out"><div class="card pad muted">Loading…</div></div>
</div></main>
<script src="/common.js"></script>
<script>
const { api, escapeHtml, fmtDate, makeDialog, todayISO } = BPP;
let DATA = null, STATUS = 'open', CAN_EDIT = false;
const amt = (n) => Number(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const TABS = [['open', 'Open'], ['presented', 'Presented'], ['excluded', 'By hand / office'], ['removed', 'Removed']];

(async function () {
  const me = await BPP.mountChrome('funds');
  if (!me) return;
  const isSU = me.user.role === 'super_user';
  CAN_EDIT = isSU || !!(me.permissions && me.permissions.funds_edit);
  for (const id of ['add', 'imp', 'rem']) document.getElementById(id).hidden = !CAN_EDIT;
  document.getElementById('add').onclick = () => editDialog(null);
  document.getElementById('imp').onclick = () => document.getElementById('file').click();
  document.getElementById('file').onchange = importFile;
  document.getElementById('rem').onclick = recheck;
  document.getElementById('exp').onclick = () => { location.href = '/api/unpresented/export'; };
  document.getElementById('pdf').onclick = exportPdf;
  load();
})();

function say(html, cls) { document.getElementById('msg').innerHTML = html ? `<div class="${cls || 'warnbox'}" style="margin-bottom:12px">${html}</div>` : ''; }

async function load() {
  try { DATA = await api('/api/unpresented?status=' + STATUS); } catch (e) { say(escapeHtml(e.message)); return; }
  render();
}

function render() {
  const d = DATA, c = d.counts || {};
  document.getElementById('tabs').innerHTML = TABS.map(([k, l]) => `<button class="sm ${k === STATUS ? 'on' : ''}" data-tab="${k}">${l}${c[k] ? ' (' + c[k] + ')' : ''}</button>`).join('');
  document.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { STATUS = b.dataset.tab; say(''); load(); });
  const open = STATUS === 'open';
  document.getElementById('sub').textContent = open
    ? `${d.count} open cheque(s) · PKR ${amt(d.total)}${d.flagged ? ' · ' + d.flagged + ' need a look' : ''}`
    : `${d.count} cheque(s)${d.status === 'excluded' ? ' – dispatched by hand / collected from an office, so not counted as outstanding' : ''}`;
  const colhead = (statusCol) => `<colgroup><col class="c-sr"><col class="c-no"><col class="c-party"><col class="c-amt"><col class="c-date"><col class="c-act"></colgroup>
    <thead><tr><th>Sr.</th><th>Chq #</th><th>Party name</th><th class="num">Amount</th><th>${statusCol}</th><th></th></tr></thead>`;
  const secs = d.sections.map((g) => {
    const rows = g.rows.map((r, i) => {
      const dateCell = STATUS === 'presented' ? fmtDate(r.presented_date) + (r.presented_by ? `<span class="note">${escapeHtml(r.presented_by)}</span>` : '') : (r.dispatch_date ? fmtDate(r.dispatch_date) : '');
      const flag = r.flag ? `<span class="flagnote">⚠ ${escapeHtml(r.flag_detail || r.flag)}</span>` : '';
      const info = (r.note ? `<span class="note">${escapeHtml(r.note)}</span>` : '') + flag;
      let acts = '';
      if (CAN_EDIT) {
        if (STATUS === 'open') acts = `<button class="sm" data-pres="${r.id}">Presented</button><button class="sm ghost" data-edit="${r.id}">Edit</button>${r.flag ? `<button class="sm ghost" data-dismiss="${r.id}" title="Ignore the warning">Dismiss</button>` : ''}<button class="sm ghost" data-del="${r.id}" title="Remove from the list">✕</button>`;
        else acts = `<button class="sm" data-reopen="${r.id}">${STATUS === 'excluded' ? 'Count as outstanding' : 'Re-open'}</button>`;
      }
      return `<tr class="${r.flag && STATUS === 'open' ? 'flagged' : ''}"><td>${i + 1}</td><td>${escapeHtml(r.cheque_no)}</td><td class="party">${escapeHtml(r.party || '')}${info}</td><td class="num">${amt(r.amount)}</td><td>${dateCell}</td><td class="acts">${acts}</td></tr>`;
    }).join('') || `<tr><td colspan="6" class="muted">No cheques.</td></tr>`;
    return `<div class="card sec"><h3><span>${escapeHtml(g.title)}</span><span class="t">${g.rows.length} · ${amt(g.total)}</span></h3>
      <table class="chq">${colhead(STATUS === 'presented' ? 'Presented on' : 'Dispatched date')}<tbody>${rows}
      <tr class="total"><td></td><td></td><td class="num">Total</td><td class="num">${amt(g.total)}</td><td></td><td></td></tr></tbody></table></div>`;
  }).join('');
  document.getElementById('out').innerHTML = (secs || '<div class="card pad muted">Nothing here.</div>') +
    (open ? `<div class="grandbar"><span>GRAND TOTAL</span><span>${amt(d.total)}</span></div>` : '');
  document.querySelectorAll('[data-pres]').forEach((b) => b.onclick = () => presentDialog(Number(b.dataset.pres)));
  document.querySelectorAll('[data-edit]').forEach((b) => b.onclick = () => editDialog(findRow(Number(b.dataset.edit))));
  document.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => removeRow(Number(b.dataset.del)));
  document.querySelectorAll('[data-reopen]').forEach((b) => b.onclick = () => act(`/api/unpresented/${b.dataset.reopen}/reopen`));
  document.querySelectorAll('[data-dismiss]').forEach((b) => b.onclick = () => act(`/api/unpresented/${b.dataset.dismiss}/dismiss-flag`));
}
const findRow = (id) => { for (const g of DATA.sections) { const r = g.rows.find((x) => x.id === id); if (r) return r; } return null; };

async function act(url, body, method = 'POST') {
  try { await api(url, { method, body: body ? JSON.stringify(body) : undefined }); load(); } catch (e) { alert(e.message); }
}
function removeRow(id) {
  const r = findRow(id);
  if (confirm(`Remove cheque ${r ? r.cheque_no : ''} from the list?\n(Use "Presented" if the bank has cleared it.)`)) act('/api/unpresented/' + id, null, 'DELETE');
}

function presentDialog(id) {
  const r = findRow(id);
  const dlg = makeDialog(`<form method="dialog"><div class="dlg-head"><h3>Mark as presented</h3><div class="sub">${escapeHtml(r.cheque_no)} · ${escapeHtml(r.party || '')} · ${amt(r.amount)}</div></div>
    <div class="dlg-body"><label class="fld"><span>Cleared by the bank on</span><input type="date" id="pd" value="${todayISO()}"></label></div>
    <div class="dlg-foot"><button type="button" id="c">Cancel</button> <button class="primary" id="ok" type="button">Mark presented</button></div></form>`);
  dlg.querySelector('#c').onclick = () => dlg.close();
  dlg.querySelector('#ok').onclick = async () => { await act(`/api/unpresented/${id}/present`, { date: dlg.querySelector('#pd').value }); dlg.close(); };
}

function editDialog(r) {
  const accs = DATA.accounts.map((a) => `<option value="${a.id}" ${r && r.bank_account_id === a.id ? 'selected' : ''}>${escapeHtml(a.label)}</option>`).join('');
  const dlg = makeDialog(`<form method="dialog"><div class="dlg-head"><h3>${r ? 'Edit cheque' : 'Add cheque'}</h3></div>
    <div class="dlg-body"><div class="formgrid">
      <label class="fld"><span>Bank account</span><select id="f_acc"><option value="">— choose —</option>${accs}</select></label>
      <label class="fld"><span>Cheque #</span><input id="f_no" value="${r ? escapeHtml(r.cheque_no) : ''}" inputmode="numeric"></label>
      <label class="fld" style="grid-column:1/-1"><span>Party name</span><input id="f_party" value="${r ? escapeHtml(r.party || '') : ''}"></label>
      <label class="fld"><span>Amount (PKR)</span><input id="f_amt" value="${r ? r.amount : ''}" inputmode="decimal"></label>
      <label class="fld"><span>Dispatched date</span><input type="date" id="f_date" value="${r ? (r.dispatch_date || '') : todayISO()}"></label>
    </div><div class="muted" style="font-size:12.5px;margin-top:8px">Bank statements uploaded later are searched for this cheque number and amount; a match marks it presented automatically.</div></div>
    <div class="dlg-foot"><button type="button" id="c">Cancel</button> <button class="primary" id="ok" type="button">Save</button></div></form>`);
  dlg.querySelector('#c').onclick = () => dlg.close();
  dlg.querySelector('#ok').onclick = async () => {
    const body = { bank_account_id: dlg.querySelector('#f_acc').value, cheque_no: dlg.querySelector('#f_no').value, party: dlg.querySelector('#f_party').value,
      amount: dlg.querySelector('#f_amt').value, dispatch_date: dlg.querySelector('#f_date').value };
    try {
      if (r) await api('/api/unpresented/' + r.id, { method: 'PUT', body: JSON.stringify(body) }); else await api('/api/unpresented', { method: 'POST', body: JSON.stringify(body) });
      dlg.close(); load();
    } catch (e) { alert(e.message); }
  };
}

// print / save as PDF: same sections as the Excel list, with a total per bank and a grand total
function exportPdf() {
  if (!DATA) return;
  const open = STATUS === 'open', d = DATA;
  const heading = { open: 'Un-Presented Cheques', presented: 'Presented Cheques', excluded: 'Cheques dispatched by hand / office', removed: 'Removed Cheques' }[STATUS];
  const dateHead = STATUS === 'presented' ? 'Presented on' : 'Dispatched date';
  let rows = '';
  for (const g of d.sections) {
    if (!g.rows.length && !open) continue;
    rows += `<tr class="co"><td class="l" colspan="5">${escapeHtml(g.title)}</td></tr>`;
    g.rows.forEach((r, i) => {
      const dt = STATUS === 'presented' ? fmtDate(r.presented_date) : (r.dispatch_date ? fmtDate(r.dispatch_date) : '');
      rows += `<tr><td class="l">${i + 1}</td><td class="l">${escapeHtml(r.cheque_no)}</td><td class="l">${escapeHtml(r.party || '')}</td><td>${amt(r.amount)}</td><td class="l">${dt}</td></tr>`;
    });
    rows += `<tr class="sub"><td class="l" colspan="3">Total (${g.rows.length})</td><td>${amt(g.total)}</td><td></td></tr><tr class="gap"><td colspan="5"></td></tr>`;
  }
  rows += `<tr class="grand"><td class="l" colspan="3">GRAND TOTAL (${d.count})</td><td>${amt(d.total)}</td><td></td></tr>`;
  BPP.printDoc({
    title: `${heading} as on ${fmtDate(todayISO())}`,
    subtitle: 'Amounts in PKR',
    orientation: 'portrait',
    tableHtml: `<table><colgroup><col style="width:7%"><col style="width:16%"><col style="width:45%"><col style="width:17%"><col style="width:15%"></colgroup>
      <thead><tr><th class="l">Sr.</th><th class="l">Chq #</th><th class="l">Party name</th><th>Amount</th><th class="l">${dateHead}</th></tr></thead><tbody>${rows}</tbody></table>`,
  });
}

async function importFile(ev) {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  say('Reading the Excel file…', 'muted');
  const fd = new FormData(); fd.append('file', f);
  try {
    const r = await api('/api/unpresented/import', { method: 'POST', body: fd });
    const bs = r.bs ? ` The bank-statement sheet closed ${r.bs.presented} cheque(s) and flagged ${r.bs.flagged}.` : '';
    say(`Imported ${r.added} cheque(s) (${r.known} were already in the list).${bs}`, 'okbox');
    STATUS = 'open'; load();
  } catch (e) { say(escapeHtml(e.message)); }
}
async function recheck() {
  say('Looking through the uploaded statements…', 'muted');
  try {
    const r = await api('/api/unpresented/rematch', { method: 'POST', body: JSON.stringify({ days: 45 }) });
    say(`Checked ${r.statements} statement(s): ${r.presented} cheque(s) marked presented, ${r.flagged} need a look.`, 'okbox');
    load();
  } catch (e) { say(escapeHtml(e.message)); }
}
</script>
</body>
</html>
